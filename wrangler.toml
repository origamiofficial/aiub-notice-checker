name = "aiub-notice-checker"
main = "build/index.js"
compatibility_date = "2026-11-13"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "aiub-notices"
database_id = "eb3f0605-6564-4082-8e47-16b308c500ad"
migrations_dir = "migrations"