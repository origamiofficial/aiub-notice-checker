[package]
name = "aiub-notice-checker"
version = "6.2.4"
edition = "2024"
rust-version = "1.100"
description = "Cloudflare Worker that checks AIUB notices and posts them to Telegram and Facebook"
license = "MIT"
repository = "https://github.com/origamiofficial/aiub-notice-checker"

[lints.clippy]
# priority = -1 on the group so the member lint below (must_use_candidate,
# which lives in the `correctness` group) can override it at priority 0.
# Without this, Clippy 1.100 errors with `clippy::lint_groups_priority`:
# "lint group `correctness` has the same priority (0) as a lint".
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
must_use_candidate = "warn"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
html-escape = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tl = "0.7.8"
worker = { version = "0.9.0", features = ["d1"] }

[dev-dependencies]
# Only used by the behavioural db tests in src/tests.rs (L2): the SQL from
# build_lightweight_detail_update() is executed against a real in-memory
# SQLite database (D1 is SQLite-backed). Dev-dependencies are not included
# in the wasm release build. `bundled` is required because the build
# environment has no libsqlite3 dev headers.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# O9: wasm is already lean (opt-level="s", LTO, small deps, rusqlite
# dev-only). Measured 2026-11-23: a panic=abort scratch build produced
# a byte-identical wasm (1,928,883 bytes both ways, raw cargo build
# before worker-build/wasm-opt), so there is no size reason to switch
# — and abort would kill the worker instance on a panic instead of
# letting it surface as an Err. Keep panic=unwind.