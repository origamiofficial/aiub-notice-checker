[package]
name = "aiub-notice-checker"
version = "6.2.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
html-escape = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tl = "0.7.8"
worker = { version = "0.9.0", features = ["d1"] }

[dev-dependencies]
# Only used by the behavioural db tests in src/tests.rs (L2): the SQL from
# build_lightweight_detail_update() is executed against a real in-memory
# SQLite database (D1 is SQLite-backed). Dev-dependencies are not included
# in the wasm release build. `bundled` is required because the build
# environment has no libsqlite3 dev headers.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1