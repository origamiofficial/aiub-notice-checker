[package]
name = "aiub-notice-checker"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
html-escape = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tl = "0.7.8"
worker = { version = "0.9.0", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1