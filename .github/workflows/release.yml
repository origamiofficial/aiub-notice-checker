name: Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force release even if no worker code changes detected"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version Bump, Benchmark & Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Smart check: only proceed if Worker files changed since last release ──
      - name: Detect Cloudflare Worker changes
        id: check_changes
        run: |
          git fetch --tags origin
          LATEST_TAG=$(git tag -l 'v[0-9]*' '[0-9]*' --sort=-v:refname | head -n 1 || true)
          echo "Latest release tag: ${LATEST_TAG:-<none>}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force }}" == "true" ]]; then
            echo "Forced release triggered via workflow_dispatch."
            echo "has_worker_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$LATEST_TAG" ]]; then
            if git diff --quiet "$LATEST_TAG" HEAD -- src/ migrations/ Cargo.toml Cargo.lock wrangler.toml; then
              echo "No Cloudflare Worker files (src/, migrations/, Cargo.toml, Cargo.lock, wrangler.toml) changed since $LATEST_TAG."
              echo "Skipping release to prevent releasing non-worker changes."
              echo "has_worker_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Cloudflare Worker changes detected since previous release."
          echo "has_worker_changes=true" >> "$GITHUB_OUTPUT"

      # ── Setup toolchains ─────────────────────────────────────────
      - name: Setup Rust stable toolchain
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly for worker-build --panic-unwind
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Set stable as default toolchain
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: rustup default stable

      - name: Cache Cargo dependencies
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # ── Re-validate tests (belt-and-suspenders) ──────────────────
      - name: Run tests before release
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      # ── Version bump ─────────────────────────────────────────────
      - name: Compute next version
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        id: version
        run: |
          chmod +x scripts/version-bump.sh
          scripts/version-bump.sh --apply

      - name: Verify no stale version strings
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          echo "Expected version: $NEW_VERSION"

          # Check Cargo.toml
          CARGO_VER=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -1)
          if [[ "$CARGO_VER" != "$NEW_VERSION" ]]; then
            echo "ERROR: Cargo.toml version ($CARGO_VER) != $NEW_VERSION" >&2
            exit 1
          fi

          # Verify scraper.rs references CARGO_PKG_VERSION at compile time
          if ! grep -q 'env!("CARGO_PKG_VERSION")' src/scraper.rs; then
            echo "ERROR: src/scraper.rs does not use env!(\"CARGO_PKG_VERSION\")" >&2
            exit 1
          fi

          # Grep for any hardcoded version strings in src/
          if grep -rnP 'aiub-notice-checker/\d+\.\d+' src/; then
            echo "ERROR: Found hardcoded version string in src/" >&2
            exit 1
          fi

          echo "✓ All version strings verified: Cargo.toml is $NEW_VERSION and User-Agent is compile-time bound"

      # ── Scraper performance benchmark ────────────────────────────
      - name: Setup Node.js for Wrangler
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler & worker-build
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: |
          npm install --no-save wrangler@latest
          if ! command -v worker-build >/dev/null 2>&1; then
            cargo install worker-build
          fi

      - name: Scraper performance benchmark
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        id: benchmark
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          START_EPOCH=$(date +%s%N)

          # Fetch 500 notices listing page from AIUB
          LISTING_URL="https://www.aiub.edu/category/notices?pageNo=1&pageSize=500"
          HTTP_CODE=$(curl -s -o /tmp/listing.html -w "%{http_code}" \
            -H "User-Agent: aiub-notice-checker/${NEW_VERSION} (+https://github.com/origamiofficial/aiub-notice-checker)" \
            -H "Accept: text/html" \
            --max-time 60 \
            "$LISTING_URL")

          END_EPOCH=$(date +%s%N)
          DURATION_MS=$(( (END_EPOCH - START_EPOCH) / 1000000 ))

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 400 ]]; then
            echo "ERROR: HTTP $HTTP_CODE fetching listing page" >&2
            cat > scrape-benchmark.json <<EOF
          {
            "version": "${NEW_VERSION}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_notices_scraped": 0,
            "success_count": 0,
            "failure_count": 1,
            "total_duration_ms": ${DURATION_MS},
            "http_status": ${HTTP_CODE},
            "error": "HTTP ${HTTP_CODE} fetching listing page",
            "threshold_met": false,
            "notices": []
          }
          EOF
            exit 1
          fi

          # Run our compiled Rust benchmark parser on the fetched HTML
          cargo run --release --bin benchmark -- /tmp/listing.html "${NEW_VERSION}" "${DURATION_MS}" scrape-benchmark.json

          # Extract summary metrics from the generated JSON
          NOTICE_COUNT=$(grep -oP '"total_notices_scraped":\s*\K[0-9]+' scrape-benchmark.json | head -1)
          THRESHOLD_MET=$(grep -oP '"threshold_met":\s*\K[a-z]+' scrape-benchmark.json | head -1)

          echo "notice_count=${NOTICE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "duration_ms=${DURATION_MS}" >> "$GITHUB_OUTPUT"
          echo "threshold_met=${THRESHOLD_MET}" >> "$GITHUB_OUTPUT"

          if [[ "$THRESHOLD_MET" != "true" ]]; then
            echo "ERROR: Scraper benchmark failed — threshold not met ($NOTICE_COUNT notices)" >&2
            exit 1
          fi

      - name: Upload benchmark artifact
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-benchmark
          path: scrape-benchmark.json
          retention-days: 90

      # ── Compile Cloudflare Worker script & bundle ────────────────
      - name: Compile Cloudflare Worker script & bundle
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: |
          worker-build --release --panic-unwind

          if [[ ! -d "build" || ! -f "build/index.js" ]]; then
            echo "ERROR: worker-build failed to generate build/index.js" >&2
            exit 1
          fi

          echo "Compiled Worker files in build/:"
          ls -la build/

          # Package compiled worker bundle into a zip archive
          zip -r worker-bundle.zip build/ wrangler.toml

      - name: Upload compiled worker artifact
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-worker
          path: |
            build/
            worker-bundle.zip
          retention-days: 90

      # ── Commit version bump & create tag ─────────────────────────
      - name: Commit version bump
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
            git push origin main
          fi

      - name: Create Git tag
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      # ── Create GitHub Release with compiled worker & benchmark ───
      - name: Generate release notes
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        id: notes
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          PREV_VERSION="${{ steps.version.outputs.previous_version }}"
          PREV_TAG="${{ steps.version.outputs.previous_tag }}"
          NOTICE_COUNT="${{ steps.benchmark.outputs.notice_count }}"
          DURATION_MS="${{ steps.benchmark.outputs.duration_ms }}"
          WITHIN_24H="${{ steps.version.outputs.within_24h }}"

          BUMP_TYPE="minor"
          if [[ "$WITHIN_24H" == "true" ]]; then
            BUMP_TYPE="hotfix (patch)"
          fi

          # Extract commit changelog between previous tag and HEAD^ (excluding the release commit)
          CHANGES=""
          if [[ -n "$PREV_TAG" ]] && git rev-parse --verify "refs/tags/$PREV_TAG" &>/dev/null; then
            CHANGES=$(git log "${PREV_TAG}..HEAD^" --pretty=format:"- %h %s" --no-merges 2>/dev/null || true)
          elif [[ -n "$PREV_VERSION" ]] && git rev-parse --verify "refs/tags/v$PREV_VERSION" &>/dev/null; then
            CHANGES=$(git log "v${PREV_VERSION}..HEAD^" --pretty=format:"- %h %s" --no-merges 2>/dev/null || true)
          fi

          if [[ -z "$CHANGES" ]]; then
            CHANGES="- Routine release with all checks passing"
          fi

          cat > release-notes.md <<EOF
          ## Release v${NEW_VERSION}

          **Version bump type:** ${BUMP_TYPE}
          **Previous version:** ${PREV_VERSION}

          ### Release Assets
          - \`worker-index.js\`: Compiled Cloudflare Worker JavaScript script
          - \`worker-bundle.zip\`: Complete compiled Worker bundle (JavaScript + WebAssembly + config)
          - \`scrape-benchmark.json\`: Scraper benchmark containing all 500 notices

          ### Scraper Benchmark
          - **Notices scraped:** ${NOTICE_COUNT}
          - **Total duration:** ${DURATION_MS}ms
          - **Benchmark artifact:** attached as \`scrape-benchmark.json\`

          ### Changes
          ${CHANGES}

          ---
          *Automated release by GitHub Actions*
          EOF

      - name: Create GitHub Release
        if: steps.check_changes.outputs.has_worker_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"

          # Collect assets:
          # 1. Benchmark json (with all 500 parsed notices)
          # 2. Worker bundle zip
          # 3. Compiled worker JavaScript entrypoint
          # 4. Compiled WebAssembly module (if present)
          RELEASE_ASSETS=("scrape-benchmark.json" "worker-bundle.zip")

          if [[ -f "build/index.js" ]]; then
            cp "build/index.js" "worker-index.js"
            RELEASE_ASSETS+=("worker-index.js")
          fi

          for wasm_file in build/*.wasm; do
            if [[ -f "$wasm_file" ]]; then
              RELEASE_ASSETS+=("$wasm_file")
            fi
          done

          echo "Publishing release v${NEW_VERSION} with assets: ${RELEASE_ASSETS[*]}"

          gh release create "v${NEW_VERSION}" "${RELEASE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "v${NEW_VERSION}" \
            --notes-file release-notes.md
