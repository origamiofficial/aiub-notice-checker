name: "CodeQL"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "32 6 * * 4"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Note: CodeQL does not natively support Rust as a first-class language.
      # This workflow uses the "actions" language to scan workflow files for
      # security issues, and relies on `cargo clippy` in the test workflow
      # for Rust-level static analysis.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:actions"
