name: Tests and Stable Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'aiub_notices.db'
      - 'rss.xml'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py live_smoke.py release_version.py test_main.py test_release_version.py
      - run: python -m unittest discover -v

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: stable-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Detect runtime changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- main.py requirements.txt \
            .github/workflows/tests.yml .github/workflows/aiub-notice-checker.yml; then
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare versioned release source
        id: version
        if: steps.changes.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -z "$latest" ]]; then
            latest="$(git tag --list '[0-9]*.[0-9]' --sort=-version:refname | head -n 1)"
          fi
          if [[ -n "$latest" ]]; then
            release_commit="$(git rev-parse "${latest}^{commit}")"
            release_parent="$(git rev-parse "${release_commit}^" 2>/dev/null || true)"
            if [[ "$release_parent" == "$GITHUB_SHA" ]]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              echo "version=$latest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          version="$(python release_version.py next "$latest")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            release_commit="$(git rev-parse "${version}^{commit}")"
            release_parent="$(git rev-parse "${release_commit}^")"
            if [[ "$release_parent" != "$GITHUB_SHA" ]]; then
              echo "Release tag $version already belongs to another source commit" >&2
              exit 1
            fi
            git cat-file blob "$version:main.py" > main.py
            echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
          else
            python release_version.py set "$version"
            echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.changes.outputs.runtime == 'true' && steps.version.outputs.skip != 'true'
        with:
          python-version: '3.13'
      - name: Install release dependencies
        if: steps.changes.outputs.runtime == 'true' && steps.version.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt
      - name: Validate exact release source
        if: steps.changes.outputs.runtime == 'true' && steps.version.outputs.skip != 'true'
        run: |
          python -m py_compile main.py live_smoke.py release_version.py test_main.py test_release_version.py
          python -m unittest discover -v
          python live_smoke.py
      - name: Rebuild complete notice database
        id: rebuild
        if: steps.changes.outputs.runtime == 'true' && steps.version.outputs.skip != 'true'
        env:
          REBUILD_DIR: ${{ runner.temp }}/aiub-notice-rebuild
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$REBUILD_DIR"
          if [[ -e "$REBUILD_DIR/aiub_notices.db" || -e "$REBUILD_DIR/rss.xml" ]]; then
            echo 'Rebuild directory is not empty' >&2
            exit 1
          fi
          (
            cd "$REBUILD_DIR"
            DRY_RUN=false \
            LOG_LEVEL=WARNING \
            TELEGRAM_BOT_API_KEY=historical-seed-no-send \
            TELEGRAM_CHAT_ID=historical-seed-no-send \
            python "$GITHUB_WORKSPACE/main.py"
          )
          count="$(python - "$REBUILD_DIR/aiub_notices.db" "$REBUILD_DIR/rss.xml" aiub_notices.db "$RELEASE_VERSION" <<'PY'
          import sqlite3
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          fresh_path, rss_path, previous_path = map(Path, sys.argv[1:4])
          release_version = sys.argv[4]
          fresh = sqlite3.connect(fresh_path)
          fresh.execute(
              "INSERT INTO app_state(key, value) VALUES('stable_release_version', ?) "
              "ON CONFLICT(key) DO UPDATE SET value=excluded.value",
              (release_version,),
          )
          fresh.commit()
          integrity = fresh.execute("PRAGMA integrity_check").fetchone()[0]
          count = fresh.execute("SELECT COUNT(*) FROM notices").fetchone()[0]
          unique = fresh.execute("SELECT COUNT(DISTINCT link) FROM notices").fetchone()[0]
          incomplete = fresh.execute(
              "SELECT COUNT(*) FROM notices WHERE title IS NULL OR trim(title)='' "
              "OR link IS NULL OR trim(link)='' OR published_date IS NULL OR content_hash=''"
          ).fetchone()[0]
          pending = fresh.execute(
              "SELECT COUNT(*) FROM notices WHERE sent_at IS NULL OR last_notified_hash IS NULL "
              "OR last_notified_hash != content_hash"
          ).fetchone()[0]
          details = fresh.execute(
              "SELECT COUNT(*) FROM notices WHERE detail_fetched_at IS NOT NULL"
          ).fetchone()[0]
          full_scan = fresh.execute(
              "SELECT value FROM app_state WHERE key='last_full_scan_at'"
          ).fetchone()
          state_version = fresh.execute(
              "SELECT value FROM app_state WHERE key='stable_release_version'"
          ).fetchone()
          fresh.close()

          if integrity != "ok":
              raise SystemExit(f"Rebuilt database integrity failed: {integrity}")
          if (not count or unique != count or incomplete or pending or not details or not full_scan
                  or not state_version or state_version[0] != release_version):
              raise SystemExit(
                  f"Invalid rebuild: rows={count}, unique={unique}, incomplete={incomplete}, "
                  f"pending={pending}, details={details}, full_scan={bool(full_scan)}, "
                  f"state_version={state_version}"
              )

          if previous_path.exists():
              previous = sqlite3.connect(f"file:{previous_path.resolve()}?mode=ro", uri=True)
              previous_count = previous.execute("SELECT COUNT(*) FROM notices").fetchone()[0]
              previous.close()
              if count * 5 < previous_count * 4:
                  raise SystemExit(
                      f"Rebuilt archive shrank from {previous_count} to {count} notices"
                  )

          items = ET.parse(rss_path).getroot().findall("channel/item")
          links = [item.findtext("link") for item in items]
          if len(items) != min(500, count) or len(set(links)) != len(links):
              raise SystemExit(
                  f"Invalid rebuilt RSS: items={len(items)}, unique_links={len(set(links))}"
              )
          if any("Links and media:" in (item.findtext("description") or "") for item in items):
              raise SystemExit("Rebuilt RSS contains attachment link lists")
          print(count)
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Rebuilt and validated $count notices from the complete AIUB archive."
      - name: Publish rebuilt notice state
        if: steps.changes.outputs.runtime == 'true' && steps.version.outputs.skip != 'true'
        env:
          REBUILD_DIR: ${{ runner.temp }}/aiub-notice-rebuild
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp main.py "$RUNNER_TEMP/release-main.py"
          git checkout -- main.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- . \
              ':(exclude)aiub_notices.db' ':(exclude)rss.xml'; then
              echo 'main received code changes while the release was being validated' >&2
              exit 1
            fi
            git checkout --detach origin/main
            python - "$REBUILD_DIR/aiub_notices.db" aiub_notices.db <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          rebuilt_path, current_path = map(Path, sys.argv[1:])
          rebuilt = sqlite3.connect(f"file:{rebuilt_path.resolve()}?mode=ro", uri=True)
          current = sqlite3.connect(f"file:{current_path.resolve()}?mode=ro", uri=True)
          rebuilt_links = {row[0] for row in rebuilt.execute("SELECT link FROM notices")}
          current_links = {row[0] for row in current.execute("SELECT link FROM notices")}
          rebuilt.close()
          current.close()
          missing = current_links - rebuilt_links
          if missing:
              raise SystemExit(
                  f"Rebuild would discard {len(missing)} notices added to main during validation"
              )
          PY
            cp "$REBUILD_DIR/aiub_notices.db" aiub_notices.db
            cp "$REBUILD_DIR/rss.xml" rss.xml
            git add -- aiub_notices.db rss.xml
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "Rebuild notice state for release $RELEASE_VERSION"
            if git push origin HEAD:main; then
              published=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          if [[ "$published" != 'true' ]]; then
            echo 'Could not publish rebuilt notice state after three attempts' >&2
            exit 1
          fi
          git checkout --detach "$GITHUB_SHA"
          cp "$RUNNER_TEMP/release-main.py" main.py
      - name: Publish stable release
        if: steps.changes.outputs.runtime == 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
          NOTICE_COUNT: ${{ steps.rebuild.outputs.count }}
        run: |
          if [[ "$TAG_EXISTS" != 'true' ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- main.py
            git commit -m "Release $RELEASE_VERSION"
            git tag -a "$RELEASE_VERSION" -m "Stable release $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi
          sha256sum main.py requirements.txt > SHA256SUMS
          cat > release-notes.md <<EOF
          Stable automated release $RELEASE_VERSION.

          Source commit: $GITHUB_SHA
          Validation: compile, unit tests, and live AIUB compatibility smoke test passed.
          Database: rebuilt from scratch and validated with $NOTICE_COUNT unique notices.
          EOF
          gh release create "$RELEASE_VERSION" main.py requirements.txt SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$RELEASE_VERSION" --notes-file release-notes.md
